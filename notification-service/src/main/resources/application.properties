server.port=8085
spring.application.name=notification-service

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.smarttask.notification.event.TaskEvent

# Email settings
# Set NOTIFICATION_ENABLED=true when ready to send real emails
app.notification.enabled=${NOTIFICATION_ENABLED:false}
app.notification.from=${MAIL_FROM:noreply@smarttask.com}

# Gmail SMTP example
# Replace with your email and app password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:yyour-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-digit-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.com.smarttask=DEBUG