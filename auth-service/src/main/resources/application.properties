server.port=8081
spring.application.name=auth-service

# H2 Database
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=SmartTask2024SecretKeyForJWTTokenGenerationMustBe256BitsLong!
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Use simple cache \u2014 no Redis needed for auth-service
#spring.cache.type=simple

# Exclude Redis autoconfiguration
#spring.autoconfigure.exclude=\
 # org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
 # org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging.level.com.smarttask=DEBUG

logging.level.org.springframework.web.servlet.resource=OFF

