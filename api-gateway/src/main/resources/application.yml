server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        # ─── Auth Service ──────────────────────────────────────
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: JwtAuthFilter

        # ─── User Service (part of auth-service) ──────────────
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuthFilter

        # ─── Task Service ──────────────────────────────────────
        - id: task-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/tasks/**
          filters:
            - name: JwtAuthFilter

        # ─── Analytics Service ─────────────────────────────────
        - id: analytics-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/dashboard/**
          filters:
            - name: JwtAuthFilter

        # ─── Collaboration Service ─────────────────────────────
        - id: collaboration-service-comments
          uri: http://localhost:8084
          predicates:
            - Path=/api/comments/**
          filters:
            - name: JwtAuthFilter

        - id: collaboration-service-audit
          uri: http://localhost:8084
          predicates:
            - Path=/api/audit/**
          filters:
            - name: JwtAuthFilter

# JWT secret — must match auth-service
app:
  jwt:
    secret: SmartTask2024SecretKeyForJWTTokenGenerationMustBe256BitsLong!

  # Public endpoints that skip JWT validation
  public-paths:
    - /api/auth/login
    - /api/users/register

logging:
  level:
    com.smarttask: DEBUG
    org.springframework.cloud.gateway: DEBUG