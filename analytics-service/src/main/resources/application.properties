server.port=8083
spring.application.name=analytics-service

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.smarttask.analytics.event.TaskEvent

# Exclude JPA and DataSource autoconfiguration
# analytics-service does not need a database
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# task-service URL
app.task-service.url=http://localhost:8082

logging.level.com.smarttask=DEBUG

# \u2500\u2500\u2500 Resilience4j Circuit Breaker \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

# Watch last 5 calls to decide state
resilience4j.circuitbreaker.instances.taskService\
  .sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.taskService\
  .sliding-window-size=5

# Trip to OPEN if 50% of calls fail
resilience4j.circuitbreaker.instances.taskService\
  .failure-rate-threshold=50

# Minimum calls before calculating failure rate
resilience4j.circuitbreaker.instances.taskService\
  .minimum-number-of-calls=3

# Wait 30 seconds in OPEN before moving to HALF-OPEN
resilience4j.circuitbreaker.instances.taskService\
  .wait-duration-in-open-state=30s

# Allow 2 test calls in HALF-OPEN state
resilience4j.circuitbreaker.instances.taskService\
  .permitted-number-of-calls-in-half-open-state=2

# Automatically move from OPEN to HALF-OPEN after timeout
resilience4j.circuitbreaker.instances.taskService\
  .automatic-transition-from-open-to-half-open-enabled=true

# Record these exceptions as failures
resilience4j.circuitbreaker.instances.taskService\
  .record-exceptions=\
  java.io.IOException,\
  java.util.concurrent.TimeoutException,\
  org.springframework.web.reactive.function\
  .client.WebClientRequestException,\
  org.springframework.web.reactive.function\
  .client.WebClientResponseException

# \u2500\u2500\u2500 Time Limiter \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# If task-service takes more than 3s \u2192 count as failure
resilience4j.timelimiter.instances.taskService\
  .timeout-duration=3s
resilience4j.timelimiter.instances.taskService\
  .cancel-running-future=true

# \u2500\u2500\u2500 Retry \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# Retry 2 times before counting as failure
resilience4j.retry.instances.taskService\
  .max-attempts=2
resilience4j.retry.instances.taskService\
  .wait-duration=500ms

# \u2500\u2500\u2500 Actuator \u2014 expose circuit breaker health \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
management.endpoints.web.exposure.include=\
  health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true